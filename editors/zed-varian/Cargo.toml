[package]
name = "zed_varian"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

# Pinned to 0.6.0 deliberately: that is the API version the previously shipped
# `zed-varian-lsp/extension.wasm` was built against, and it is the only version
# this repo has direct evidence loads in the Zed in use here (1.11.3). Bumping
# it is a separate, testable change — do not bump it casually, because an
# unsupported API version makes the whole extension fail to load, which
# presents as "no syntax highlighting" rather than as an LSP error.
[dependencies]
zed_extension_api = "0.6.0"
