id = "varian"
name = "Varian"
description = "Varian language support for Zed: tree-sitter grammar, syntax highlighting, themes, file icons, and the Varian + Lumen languages."
version = "0.1.0"
schema_version = 1
authors = ["VarianLang"]
repository = "https://github.com/Chidi09/VarianLang"

# Languages, themes, and icon themes are auto-discovered from their
# respective subdirectories. They are listed here to keep the manifest
# self-describing; populate_defaults() will keep these in sync at load time.
languages = ["languages/Varian", "languages/Lumen"]
themes = ["themes/varian.json"]
icon_themes = ["icon_themes/varian.json"]

[grammars.varian]
repository = "https://github.com/Chidi09/tree-sitter-varian"
rev = "8a88f6edf98e6edf44a459540914a9d83be4b82f"

# The Varian LSP (`vn lsp`) is declared HERE, in the same extension that
# declares the `Varian` and `Lumen` languages, and is backed by the Rust
# adapter in src/lib.rs (see the file header for the full rationale).
#
# It used to live in a separate `varian-lsp` extension. Zed loaded that
# extension but never spawned the server — no attempt, no error — because a
# server declared in one extension was not being matched to a language declared
# in another. The old note here warned that declaring `[language_servers.*]`
# without Rust code makes Zed fail to load the extension entirely (killing
# syntax highlighting as well); that is true, and the fix is the Rust code now
# sitting in src/lib.rs, not a second extension.
[language_servers.varian-lsp]
languages = ["Varian", "Lumen"]

# Permission to spawn `vn lsp`. Zed denies process execution to extensions that
# do not declare it. The trailing `**` allows any extra arguments a user adds
# via `lsp.varian-lsp.binary.arguments`.
[[capabilities]]
kind = "process:exec"
command = "vn"
args = ["lsp", "**"]
